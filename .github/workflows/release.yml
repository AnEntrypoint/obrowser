name: release

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: obrowser-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: AnEntrypoint/rs-plugkit/.github/workflows/wasm-plugin-release.yml@main
    with:
      wasm_artifact_name: oxibrowser_core.wasm
      published_asset_basename: oxibrowser
      release_repo: AnEntrypoint/obrowser-bin
      release_title_prefix: obrowser
      build_command: cargo build --release -p oxibrowser-core --no-default-features --target wasm32-wasip1
      npm_package_name: obrowser-wasm
    secrets:
      publisher_token: ${{ secrets.PUBLISHER_TOKEN }}
      npm_token: ${{ secrets.NPM_TOKEN }}
